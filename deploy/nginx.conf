# Exemplo pra Nginx — junte no server {} do subdomínio (mantenha suas linhas de SSL).
# A porta tem que ser a mesma do PORT no .env. Depois: sudo nginx -t && sudo systemctl reload nginx

server {
    server_name auau.joaoschianti.com;

    # Padrão do Nginx é 1 MB — o app aceita fotos de até 5 MB
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_set_header Host $host;
        # Substitui (não acrescenta): o visitante não consegue forjar o IP e fugir do limite de login
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
